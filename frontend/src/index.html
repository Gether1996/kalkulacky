<body>
  <!-- Apply the saved/OS theme before render to avoid a flash of light. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('kalk_theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
