<div class="register-container">
  <div class="register-card">
    <h2>Registrácia</h2>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email *</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="email?.invalid && email?.touched"
          placeholder="vas@email.com"
        />
        <div class="invalid-feedback" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Email je povinný</span>
          <span *ngIf="email?.errors?.['email']">Neplatný email formát</span>
        </div>
      </div>

      <!-- First Name Field -->
      <div class="form-group">
        <label for="first_name">Meno</label>
        <input
          type="text"
          id="first_name"
          formControlName="first_name"
          class="form-control"
          placeholder="Vaše meno"
        />
      </div>

      <!-- Last Name Field -->
      <div class="form-group">
        <label for="last_name">Priezvisko</label>
        <input
          type="text"
          id="last_name"
          formControlName="last_name"
          class="form-control"
          placeholder="Vaše priezvisko"
        />
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Heslo *</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="password?.invalid && password?.touched"
          placeholder="Minimálne 8 znakov"
        />
        <div class="invalid-feedback" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Heslo je povinné</span>
          <span *ngIf="password?.errors?.['minlength']">Heslo musí mať aspoň 8 znakov</span>
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label for="password_confirm">Potvrdenie hesla *</label>
        <input
          type="password"
          id="password_confirm"
          formControlName="password_confirm"
          class="form-control"
          [class.is-invalid]="(password_confirm?.invalid && password_confirm?.touched) || (registerForm.errors?.['passwordMismatch'] && password_confirm?.touched)"
          placeholder="Zopakujte heslo"
        />
        <div class="invalid-feedback" *ngIf="password_confirm?.invalid && password_confirm?.touched">
          <span *ngIf="password_confirm?.errors?.['required']">Potvrdenie hesla je povinné</span>
        </div>
        <div class="invalid-feedback" *ngIf="registerForm.errors?.['passwordMismatch'] && password_confirm?.touched">
          <span>Heslá sa nezhodujú</span>
        </div>
      </div>

      <!-- Error Message -->
      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loading || registerForm.invalid"
      >
        <span *ngIf="loading">Registrácia...</span>
        <span *ngIf="!loading">Registrovať sa</span>
      </button>
    </form>

    <!-- Login Link -->
    <div class="text-center mt-3">
      <p>Už máte účet? <a routerLink="/login">Prihláste sa</a></p>
    </div>
  </div>
</div>
